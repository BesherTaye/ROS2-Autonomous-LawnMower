controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0

      min_speed_xy: 0.0
      max_speed_xy: 0.35

      min_speed_theta: 0.15
      max_vel_theta: 0.70

      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.5

      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 21

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.5
controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0

      max_vel_theta: 0.50

      min_speed_xy: 0.0
      max_speed_xy: 0.20

      min_speed_theta: 0.10

      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5

      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5

      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 21

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.5

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      [
        "spin",
        "backup",
        "drive_on_heading",
        "wait"
      ]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5

    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.0


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

    transform_tolerance: 0.5

    navigators:
      - navigate_to_pose
      - navigate_through_poses


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[-0.30, -0.20],
                   [-0.30,  0.20],
                   [ 0.30,  0.20],
                   [ 0.30, -0.20]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.12
          obstacle_max_range: 3.0

          raytrace_min_range: 0.12
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[-0.30, -0.20],
                   [-0.30,  0.20],
                   [ 0.30,  0.20],
                   [ 0.30, -0.20]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.12
          obstacle_max_range: 3.0

          raytrace_min_range: 0.12
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: true


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 15.0

    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.20, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]

    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

    odom_topic: /odometry/filtered
    odom_duration: 0.1

    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel

    transform_tolerance: 0.5
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: false

    polygons:
      - PolygonStop

    PolygonStop:
      type: polygon

      # Slightly larger than the robot footprint.
      points: "[[0.38, 0.28],
                [0.38, -0.28],
                [-0.33, -0.28],
                [-0.33, 0.28]]"

      action_type: stop
      min_points: 3

      visualize: true
      polygon_pub_topic: polygon_stop

    observation_sources:
      - scan

    scan:
      type: scan
      topic: /scan
      source_timeout: 0.5
      enabled: true