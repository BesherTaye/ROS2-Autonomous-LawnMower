amcl:
  ros__parameters:
    use_sim_time: true

    # =====================================================
    # FRAMES
    # =====================================================

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    # =====================================================
    # LIDAR
    # =====================================================

    scan_topic: scan

    laser_model_type: likelihood_field
    max_beams: 60

    laser_min_range: -1.0
    laser_max_range: 10.0

    laser_likelihood_max_dist: 2.0

    sigma_hit: 0.2
    lambda_short: 0.1

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5

    do_beamskip: false

    # =====================================================
    # MOTION MODEL
    # =====================================================

    robot_model_type: nav2_amcl::DifferentialMotionModel

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # =====================================================
    # PARTICLE FILTER
    # =====================================================

    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    resample_interval: 1

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # =====================================================
    # UPDATE THRESHOLDS
    # =====================================================

    update_min_d: 0.10
    update_min_a: 0.10

    # =====================================================
    # TRANSFORM
    # =====================================================

    tf_broadcast: true
    transform_tolerance: 1.0

    # =====================================================
    # INITIAL POSE
    # =====================================================

    set_initial_pose: true
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # =====================================================
    # OTHER
    # =====================================================

    save_pose_rate: 0.5
    first_map_only: false